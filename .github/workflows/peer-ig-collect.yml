name: Peer watch (Instagram)

# Reads peer organisations' public Instagram posts through business_discovery
# (collector/peers-ig.js; list in config/peers-ig.json). Free: no paid API, no
# scraping. DORMANT: the scheduled run does nothing until the repository
# VARIABLE PEER_IG_ENABLED is set to 'true' (after sql/peer-schema.sql is
# applied). workflow_dispatch always runs, so a dry run can be tried first.
#
# Daily 06:10 UTC, clear of the nightly Meta run (04:30) and the X run (05:15).
# Daily since 30 Oct 2026 (was Mondays): ally_watch exists to catch an ally's
# post while it is still taking off, and a weekly read saw it up to six days
# late. Still free: ~60 business_discovery calls a day.
#
# Opponents (31 Oct 2026, authorised by Christopher Joyce, Asana
# 1220076872722026): the scheduled run then reads config/opponents-ig.json the
# same way, and their UK issue ads from Meta's Ad Library (collector/ad-library.js),
# and deletes opponent data older than 120 days. Free sources only. To stop it,
# set OPPONENTS_IG_ENABLED below to 'false': both steps become dry runs.

on:
  schedule:
    - cron: '10 6 * * *'
  workflow_dispatch:
    inputs:
      list:
        description: 'Manual runs only: allies (config/peers-ig.json) or opponents (config/opponents-ig.json plus their Ad Library ads). The schedule runs both.'
        type: choice
        options: [allies, opponents]
        default: allies
      only:
        description: 'Comma-separated handles to restrict to (blank = all)'
        required: false
        default: ''
      posts:
        description: 'Latest posts to read per account (1-100)'
        required: false
        default: '50'
      dry_run:
        description: 'Print what would be stored; write nothing'
        type: boolean
        required: false
        default: true

permissions:
  contents: read

concurrency:
  group: peer-ig-collect
  cancel-in-progress: false

jobs:
  collect:
    if: github.event_name == 'workflow_dispatch' || vars.PEER_IG_ENABLED == 'true'
    runs-on: ubuntu-latest
    # ~60 calls; anything near this limit means something is looping.
    timeout-minutes: 15

    env:
      META_TOKENS: ${{ secrets.META_TOKENS }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      PEER_IG_VIA: ${{ vars.PEER_IG_VIA }}
      # @citizengo_uk. Not listed by /me/accounts, so it is addressed by id.
      PEER_IG_VIA_ID: ${{ vars.PEER_IG_VIA_ID || '17841422748868275' }}
      ONLY: ${{ github.event.inputs.only }}
      LIST: ${{ github.event.inputs.list || 'allies' }}
      # Opponent collection switch. On since 31 Oct 2026 (authorised by
      # Christopher Joyce); 'false' turns opponents back into dry runs.
      OPPONENTS_IG_ENABLED: 'true'
      POSTS: ${{ github.event.inputs.posts || '50' }}
      # Scheduled runs write; manual runs default to a dry run.
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.dry_run == true || github.event.inputs.dry_run == 'true') && 'true' || 'false' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '24'

      - name: Test
        run: node scripts/test-peers-ig.js

      - name: Test opponent ads
        run: node scripts/test-ad-library.js

      - name: Allies
        if: github.event_name == 'schedule' || env.LIST == 'allies'
        run: |
          FLAG=""
          if [ "$DRY_RUN" = "true" ]; then FLAG="--dry-run"; fi
          ONLYARG=""
          if [ -n "$ONLY" ]; then ONLYARG="--only $ONLY"; fi
          node collector/peers-ig.js $FLAG $ONLYARG --list allies --posts "$POSTS"

      # Opponents run even if the allies step failed: they are separate accounts.
      - name: Opponents (Instagram)
        if: always() && (github.event_name == 'schedule' || env.LIST == 'opponents')
        run: |
          FLAG=""
          if [ "$DRY_RUN" = "true" ]; then FLAG="--dry-run"; fi
          ONLYARG=""
          if [ -n "$ONLY" ]; then ONLYARG="--only $ONLY"; fi
          node collector/peers-ig.js $FLAG $ONLYARG --list opponents --posts "$POSTS"

      - name: Opponents (Ad Library)
        if: always() && (github.event_name == 'schedule' || env.LIST == 'opponents')
        run: |
          FLAG=""
          if [ "$DRY_RUN" = "true" ]; then FLAG="--dry-run"; fi
          node collector/ad-library.js $FLAG --days 90
