name: Connected Instagram collection

# Instagram accounts connected by their holders (spokespeople's professional
# accounts; lib/igauth.js). Refreshes each 60-day token once it is a day old,
# then reads posts and insights. Free: the Instagram API does not bill per call.
# Runs before the link registry (06:40) so tonight's posts reach link_performance.

on:
  schedule:
    - cron: '15 6 * * *'
  workflow_dispatch:
    inputs:
      days:
        description: 'Posts from the last N days (nightly 30; a first run reads full history)'
        required: false
        default: '30'
      accounts:
        description: 'Space-separated Instagram usernames to restrict to (blank = all)'
        required: false
        default: ''
      dry_run:
        description: 'Write to data/*.ndjson instead of Supabase'
        type: boolean
        required: false
        default: false

concurrency:
  group: ig-connected-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      X_TOKEN_PRIVATE_KEY: ${{ secrets.X_TOKEN_PRIVATE_KEY }}
      META_TOKENS: ${{ secrets.META_TOKENS }}
      DAYS: ${{ github.event.inputs.days || '30' }}
      ACCOUNTS: ${{ github.event.inputs.accounts }}
      DRY_RUN: ${{ (github.event.inputs.dry_run == true || github.event.inputs.dry_run == 'true') && 'true' || 'false' }}
      ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '24'
      - name: Collect
        run: |
          FLAG=""; if [ "$DRY_RUN" = "true" ]; then FLAG="--dry-run"; fi
          ACC=""; if [ -n "$ACCOUNTS" ]; then ACC="--accounts $ACCOUNTS"; fi
          node collector/ig-connected.js --days "$DAYS" $FLAG $ACC
      - name: Alert on failure
        if: failure() && env.ALERT_WEBHOOK_URL != ''
        run: |
          curl -s -X POST -H 'Content-Type: application/json' \
            -d "{\"text\":\"Connected Instagram collection FAILED - run ${{ github.run_number }}. See ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "$ALERT_WEBHOOK_URL" || true
