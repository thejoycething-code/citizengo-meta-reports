name: X account lookup

# When did some X accounts last post (scripts/x-lookup.js)? One users/by call
# through a connected account's credential; ~$0.01 per account found. The
# collector's credential code saves X's rotated refresh token, so this cannot
# break nightly collection.

on:
  workflow_dispatch:
    inputs:
      usernames:
        description: 'Space-separated X usernames (without @)'
        required: true
      via:
        description: 'Connected account whose credential to use'
        required: false
        default: 'CitizenGO'

concurrency:
  group: x-collect   # never alongside the collector: both rotate refresh tokens
  cancel-in-progress: false

jobs:
  lookup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      X_CLIENT_ID: ${{ secrets.X_CLIENT_ID }}
      X_CLIENT_SECRET: ${{ secrets.X_CLIENT_SECRET }}
      X_TOKEN_PRIVATE_KEY: ${{ secrets.X_TOKEN_PRIVATE_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      USERNAMES: ${{ github.event.inputs.usernames }}
      VIA: ${{ github.event.inputs.via }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '24'
      - name: Look up
        run: node scripts/x-lookup.js $USERNAMES --via "${VIA:-CitizenGO}"
