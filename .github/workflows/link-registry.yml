name: Link registry

# Builds link_posts: every CitizenGO link our connected accounts posted
# (Facebook, Instagram, X), with its campaign code, for the link_performance
# tool. Reads only what the other collectors stored, plus one redirect lookup
# per new cgo.ac short link, so it is cheap: no social API calls, no X billing.
# Signatures per code are loaded separately on the Mac Mini
# (scripts/link-signatures-mini.sh), because Looker is reachable only there.

on:
  schedule:
    # 06:40 UTC: after the Meta collection (04:30, ~25 min) and the X
    # collection (05:15), so last night's posts are in.
    - cron: '40 6 * * *'
  workflow_dispatch:
    inputs:
      days:
        description: 'Posts from the last N days (nightly 30)'
        required: false
        default: '30'
      all:
        description: 'Every post we hold (backfill)'
        type: boolean
        required: false
        default: false

concurrency:
  group: link-registry
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      DAYS: ${{ github.event.inputs.days || '30' }}
      ALL: ${{ (github.event.inputs.all == true || github.event.inputs.all == 'true') && 'true' || 'false' }}
      ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '24'
      - name: Build the registry
        run: |
          if [ "$ALL" = "true" ]; then node collector/links.js --all; else node collector/links.js --days "$DAYS"; fi
      - name: Alert on failure
        if: failure() && env.ALERT_WEBHOOK_URL != ''
        run: |
          curl -s -X POST -H 'Content-Type: application/json' \
            -d "{\"text\":\"Link registry FAILED - run ${{ github.run_number }}. See ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "$ALERT_WEBHOOK_URL" || true
