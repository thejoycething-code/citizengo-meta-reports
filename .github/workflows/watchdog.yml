name: Watchdog

# Answers one question daily: is the data still arriving?
#
# SEPARATE from the collector on purpose. On 27 and 28 August 2026 the nightly
# run did not happen at all and nothing said so - an alert built into the
# collector cannot fire when the collector is what failed to run. This reads
# only the database and knows nothing about Meta, tokens or the collector.
#
# It also runs at a different time, so a problem affecting one scheduled
# workflow is less likely to silence both.
#
# Since 3 Sep 2026 it also answers: how long until somebody's CONNECTOR access
# expires? Per-person tokens last 90 days, and one that lapses unannounced looks
# to its holder like the tool breaking.
#
# Since 29 Aug 2026 it answers a second question: how long until the Meta token
# expires? Access runs through a personal Facebook profile - the citizenGO
# portfolio cannot have apps added, so a System User is not possible - and those
# tokens last 60 days. Waiting for staleness to reveal an expiry means finding
# out two days late and diagnosing a symptom instead of a cause.

on:
  schedule:
    # 09:00 UTC - a few hours after the 04:30 collection, and during the
    # European working day so an alert is seen rather than slept through.
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      test_alert:
        description: 'Send a test alert instead of checking freshness'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
      META_TOKENS: ${{ secrets.META_TOKENS }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '24'

      # Fails the job when data is stale, so the run goes red and GitHub emails
      # even without a webhook configured.
      - name: Check data is still arriving
        run: |
          if [ "${{ github.event.inputs.test_alert }}" = "true" ]; then
            node scripts/check-freshness.js --test-alert
          else
            node scripts/check-freshness.js --max-age-days 2
          fi

      # if: always() so an expiring token is still reported when the data is
      # ALSO stale. Those two arrive together far more often than separately -
      # the token dies, then collection stops - and reporting only the staleness
      # describes the symptom while hiding the cause.
      - name: Check how long the Meta tokens have left
        if: always() && github.event.inputs.test_alert != 'true'
        run: node scripts/check-token-expiry.js --warn-days 21 --fail-days 7

      # Per-person connector tokens expire 90 days after issue. Same if:
      # always() reasoning as above: an expiring credential is worth reporting
      # even when something else in this job has already failed.
      - name: Check how long the access tokens have left
        if: always() && github.event.inputs.test_alert != 'true'
        run: node scripts/check-access-tokens.js --warn-days 21 --fail-days 7

      - name: Summary
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "Collection is up to date." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Collection has stopped" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Either no new data for two days, a Meta token is close to expiring, or a staff access token is. The steps above say which." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Token renewal: generate a fresh token on the profile that owns it, extend it to 60 days in the Access Token Debugger, then update the META_TOKENS secret." >> "$GITHUB_STEP_SUMMARY"
          fi
