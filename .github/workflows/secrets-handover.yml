name: One-off secrets handover to the Mac Mini (temporary)
# 2 Nov 2026, deleted straight after use. Encrypts the collection secrets with a
# public key generated on the Mac Mini and uploads only the ciphertext; the
# private key never leaves the Mini. No value is ever printed.
on:
  workflow_dispatch:
    inputs:
      pubkey_b64:
        description: Base64 of the Mini's one-time RSA public key (PEM)
        required: true
permissions:
  contents: read
jobs:
  handover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      META_TOKENS: ${{ secrets.META_TOKENS }}
      ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
      X_CLIENT_ID: ${{ secrets.X_CLIENT_ID }}
      X_CLIENT_SECRET: ${{ secrets.X_CLIENT_SECRET }}
      X_TOKEN_PRIVATE_KEY: ${{ secrets.X_TOKEN_PRIVATE_KEY }}
      PUBKEY_B64: ${{ github.event.inputs.pubkey_b64 }}
    steps:
      - name: Encrypt
        run: |
          set -euo pipefail
          umask 077
          mkdir out
          printf '%s' "$PUBKEY_B64" | base64 -d > pub.pem
          openssl pkey -pubin -in pub.pem -noout
          # One KEY=value line each. META_TOKENS: newlines become commas (the
          # collector accepts both). The PEM key: newlines become a literal \n
          # (the code turns \n back into newlines). Others: newlines dropped.
          line() { printf '%s=%s\n' "$1" "$2"; }
          {
            line META_TOKENS "$(printf '%s' "$META_TOKENS" | tr -d '\r' | awk 'NF' | paste -sd, -)"
            line ALERT_WEBHOOK_URL "$(printf '%s' "$ALERT_WEBHOOK_URL" | tr -d '\r\n')"
            line X_CLIENT_ID "$(printf '%s' "$X_CLIENT_ID" | tr -d '\r\n')"
            line X_CLIENT_SECRET "$(printf '%s' "$X_CLIENT_SECRET" | tr -d '\r\n')"
            line X_TOKEN_PRIVATE_KEY "$(printf '%s' "$X_TOKEN_PRIVATE_KEY" | tr -d '\r' | awk 'BEGIN{ORS="\\n"}1' | sed 's/\\n$//')"
          } > plain.env
          for k in META_TOKENS ALERT_WEBHOOK_URL X_CLIENT_ID X_CLIENT_SECRET X_TOKEN_PRIVATE_KEY; do
            v="$(sed -n "s/^$k=//p" plain.env)"; echo "$k: ${#v} chars"
          done
          openssl rand -out aes.key 32
          openssl enc -aes-256-cbc -pbkdf2 -salt -in plain.env -out out/secrets.enc -pass file:aes.key
          openssl pkeyutl -encrypt -pubin -inkey pub.pem -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in aes.key -out out/key.enc
          shred -u plain.env aes.key 2>/dev/null || rm -f plain.env aes.key
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: secrets-handover
          path: out/
          retention-days: 1
