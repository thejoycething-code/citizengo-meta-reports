name: Nightly collection

# Runs the organic post collector against every Business Portfolio we hold a
# token for, writes to Supabase, then refreshes the Google Sheet mirror.
#
# Why GitHub Actions rather than Vercel Cron: at 35 pages the collector runs for
# 15-25 minutes (roughly 9 API calls per post). Vercel functions cap at 300s even
# on Pro, so the job cannot fit. Actions allows 6 hours and the nightly run costs
# ~450-750 minutes/month against a 2,000-minute free allowance.

on:
  schedule:
    # 04:30 UTC — after midnight across all our timezones, before European
    # working hours, and late enough that Meta's insights have settled.
    # GitHub may delay scheduled runs by 10+ minutes under load; harmless here.
    - cron: '30 4 * * *'
  workflow_dispatch:
    inputs:
      lookback_days:
        description: 'Days of posts to re-poll (14 nightly; use 90+ for a backfill)'
        required: false
        default: '14'
      max_posts:
        description: 'Max posts per page'
        required: false
        default: '200'
      concurrency:
        description: 'Parallel posts in flight per page'
        required: false
        default: '6'
      page_ids:
        description: 'Space-separated page IDs to restrict to (blank = every reachable page). Use for backfilling one portfolio at a time.'
        required: false
        default: ''
      dry_run:
        description: 'Write to data/*.ndjson instead of Supabase'
        type: boolean
        required: false
        default: false

# Read-only: this workflow never commits anything back to the repo.
permissions:
  contents: read

# Never let two collections overlap — they would race on the same
# (post_id, collected_date) rows.
concurrency:
  group: nightly-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # 180 covers the nightly 14-day window several times over. The higher cap
    # is for the manual 90-day backfills: ~2,700 posts at 9-12 calls each runs
    # for two to three hours, and a job killed at 180 minutes leaves the last
    # pages on stale data with a green tick.
    timeout-minutes: 330

    env:
      META_TOKENS: ${{ secrets.META_TOKENS }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      GRAPH_VERSION: ${{ vars.GRAPH_VERSION || 'v23.0' }}
      LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '14' }}
      MAX_POSTS: ${{ github.event.inputs.max_posts || '200' }}
      CONCURRENCY: ${{ github.event.inputs.concurrency || '6' }}
      PAGE_IDS: ${{ github.event.inputs.page_ids }}
      # Declared at JOB level so the step-level `if` conditions below can read
      # them. Step-level env is invisible to that step's own `if`.
      SHEET_ID: ${{ secrets.SHEET_ID }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
      SLACK_BREAKOUT_WEBHOOK_URL: ${{ secrets.SLACK_BREAKOUT_WEBHOOK_URL }}
      DRY_RUN: ${{ (github.event.inputs.dry_run == true || github.event.inputs.dry_run == 'true') && 'true' || 'false' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # No cache and no `npm install` — the project has zero dependencies by
      # design, so there is nothing to restore.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '24'

      - name: Check required secrets
        run: |
          echo "dry run: $DRY_RUN"
          echo
          echo "Secret visibility to this runner (lengths only, never values):"
          report() {
            if [ -n "$2" ]; then
              echo "  SET      $1  (${#2} chars)"
            else
              echo "  MISSING  $1"
            fi
          }
          report META_TOKENS "$META_TOKENS"
          report SUPABASE_URL "$SUPABASE_URL"
          report SUPABASE_SERVICE_KEY "$SUPABASE_SERVICE_KEY"
          report SHEET_ID "$SHEET_ID"
          report GOOGLE_SERVICE_ACCOUNT_JSON "$GOOGLE_SERVICE_ACCOUNT_JSON"
          report ALERT_WEBHOOK_URL "$ALERT_WEBHOOK_URL"
          report SLACK_BREAKOUT_WEBHOOK_URL "$SLACK_BREAKOUT_WEBHOOK_URL"
          echo

          missing=""
          [ -z "$META_TOKENS" ] && missing="$missing META_TOKENS"
          if [ "$DRY_RUN" != "true" ]; then
            [ -z "$SUPABASE_URL" ] && missing="$missing SUPABASE_URL"
            [ -z "$SUPABASE_SERVICE_KEY" ] && missing="$missing SUPABASE_SERVICE_KEY"
          fi
          if [ -n "$missing" ]; then
            echo "::error::Missing required secrets:$missing"
            echo "If you believe these are set, check ALL of:"
            echo "  1. They are under Settings > Secrets and variables > ACTIONS"
            echo "     (NOT the Dependabot or Codespaces tabs, and NOT the Variables tab)."
            echo "  2. They are on THIS repository, not another one."
            echo "  3. They are REPOSITORY secrets, not ENVIRONMENT secrets."
            echo "     Environment secrets are invisible unless the job declares"
            echo "     'environment:', which this workflow does not."
            echo "  4. The names match exactly - no trailing spaces, correct case."
            echo ""
            echo "SUPABASE_URL may be set as either a secret or a repository VARIABLE"
            echo "- it is a public project URL, not a credential."
            exit 1
          fi
          echo "Tokens configured: $(echo "$META_TOKENS" | tr ',' '\n' | grep -c .)"

      - name: Collect
        id: collect
        run: |
          FLAG=""
          if [ "$DRY_RUN" = "true" ]; then FLAG="--dry-run"; fi
          # PAGE_IDS is intentionally unquoted: the collector takes page ids as
          # separate positional arguments.
          node collector/collect.js \
            --lookback-days "$LOOKBACK_DAYS" \
            --max-posts "$MAX_POSTS" \
            --concurrency "$CONCURRENCY" \
            $FLAG $PAGE_IDS

      # Mirror refresh. Skipped rather than failed when unconfigured, so the
      # collection itself is never blocked by Sheet credentials.
      - name: Refresh Google Sheet mirror
        if: success() && env.SHEET_ID != '' && env.DRY_RUN != 'true'
        run: node collector/sync-sheet.js --push

      # Breakout alerts. Runs AFTER collection, because it reads the metrics the
      # collection just wrote, and only on a successful non-dry run - announcing
      # figures from a half-finished collection would be worse than silence.
      #
      # Skipped rather than failed when the webhook is unset, matching the Sheet
      # step: a missing Slack credential must never block the collector.
      #
      # continue-on-error, deliberately: this is a nice-to-have notification, and
      # a Slack outage or a rate limit should not turn the nightly collection red
      # and send everyone chasing a data problem that does not exist. The script
      # records an announcement only after Slack accepts it, so anything missed
      # here is simply picked up tomorrow.
      - name: Announce posts past 100,000 views
        if: success() && env.SLACK_BREAKOUT_WEBHOOK_URL != '' && env.DRY_RUN != 'true'
        continue-on-error: true
        run: node scripts/breakout-alerts.js --post

      # Kept on failure too — the run log is how you diagnose a token that died
      # or a page that started returning permissions errors.
      - name: Upload output and logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: collection-${{ github.run_number }}
          path: |
            data/
          retention-days: 14
          if-no-files-found: ignore

      # PII-free alert, matching the ALERT_WEBHOOK_URL pattern already used in
      # clacton-vercel. Dormant unless the secret is set.
      - name: Alert on failure
        if: failure() && env.ALERT_WEBHOOK_URL != ''
        run: |
          curl -s -X POST -H 'Content-Type: application/json' \
            -d "{\"text\":\"Meta organic collector FAILED - run ${{ github.run_number }}. No personal data here; see the Actions log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "$ALERT_WEBHOOK_URL" || true
